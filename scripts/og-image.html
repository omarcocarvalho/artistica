<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: Fraunces;
    src: url('{{FRAUNCES}}');
    font-weight: 100 900;
  }
  @font-face {
    font-family: Atkinson;
    src: url('{{ATKINSON}}');
    font-weight: 200 800;
  }
  @font-face {
    font-family: Caveat;
    src: url('{{CAVEAT}}');
    font-weight: 400 700;
  }
  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #f4ede1;
    color: #2b2420;
  }
  body {
    display: grid;
    grid-template-columns: 640px 1fr;
    align-items: center;
    padding: 0 72px;
    box-sizing: border-box;
    gap: 48px;
    font-family: Atkinson, sans-serif;
  }
  .hand {
    font-family: Caveat, cursive;
    color: #b0432a;
    font-size: 44px;
    transform: rotate(-2deg);
    display: inline-block;
  }
  h1 {
    font-family: Fraunces, serif;
    font-size: 68px;
    line-height: 1.05;
    margin: 8px 0 20px;
    font-weight: 650;
  }
  p {
    font-size: 28px;
    margin: 0;
    color: #5b4f46;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    font-family: Fraunces, serif;
    font-size: 40px;
    font-weight: 600;
  }
  .mark {
    width: 64px;
    height: 64px;
  }
  .mark__sheet {
    fill: #fff;
    stroke: #2b2420;
  }
  .mark__tile {
    fill: #b0432a;
  }
  .mark__spiral,
  .mark__rule {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .mark__spiral {
    stroke: #e2b13c;
  }
  .mark__rule {
    stroke: #2b2420;
  }
  .sheets {
    position: relative;
    height: 480px;
  }
  .sheet {
    position: absolute;
    background: #fff;
    box-shadow: 0 8px 28px rgba(60, 40, 20, 0.28);
  }
  .sheet i {
    position: absolute;
    background: #c9a77f;
  }
</style>

        <rect

          stroke-width="1.6"
        />
        <path class="mark__rule" d="M10 24.5h9" stroke-width="2" />

    </svg>
    Artistica
  </div>
  <span class="hand">for drawing &amp; painting</span>
  <h1>Print-ready reference sheets</h1>
  <p>Pack photos onto A4 or Letter. Crop marks and bleed. Free and private.</p>
</div>
